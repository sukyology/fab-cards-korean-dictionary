name: Deploy to GitHub Pages

# 저장소에 커밋된 public/ 을 그대로 GitHub Pages에 게시한다.
# 카드 데이터(public/cards.json)는 이미 저장소에 동기화되어 있으므로
# 배포 시 외부 다운로드가 없다. 데이터 갱신은 "Sync card data" 워크플로로 한다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
