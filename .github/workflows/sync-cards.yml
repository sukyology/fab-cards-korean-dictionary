name: Sync card data

# 원본(the-fab-cube)에서 최신 카드 데이터를 받아 한글 번역을 머지하고
# public/cards.json 을 갱신하여 저장소에 커밋한다.
# 커밋이 생기면 Deploy 워크플로가 이어서 사이트를 재배포한다.
#
# 실행: 저장소 Actions 탭 → "Sync card data" → Run workflow (수동)
#       또는 매주 월요일 자동 실행(아래 schedule).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 00:00 UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 캐시를 지워 원본을 새로 내려받도록 함
      - name: Build card data from source
        run: |
          rm -rf .cache
          node scripts/build-data.mjs

      - name: Commit updated card data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cards.json public/keywords.json
          if git diff --staged --quiet; then
            echo "변경 없음: 원본 데이터가 이미 최신입니다."
          else
            git commit -m "chore: 원본 카드 데이터 동기화"
            git push
          fi
