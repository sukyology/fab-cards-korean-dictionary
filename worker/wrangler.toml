name = "fab-translate-pr"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 사이트와 같은 도메인 경로로 붙이면 CORS 없이 동작한다(권장).
# dol-dari.com 존이 Cloudflare에 있어야 하며, wrangler deploy 시 이 라우트가 등록된다.
routes = [
  { pattern = "fab.dol-dari.com/api/*", zone_name = "dol-dari.com" }
]

[vars]
GITHUB_OWNER = "sukyology"
GITHUB_REPO = "fab-cards-korean-dictionary"
BASE_BRANCH = "main"
TRANSLATIONS_PATH = "data/translations.json"
KEYWORDS_PATH = "data/keywords.json"
ALLOWED_ORIGIN = "https://fab.dol-dari.com"

# 시크릿은 wrangler.toml에 넣지 말고 아래 명령으로 등록:
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put TURNSTILE_SECRET   (Turnstile 사용 시)
